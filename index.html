<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello...</title>
  <style>
    body { font-family: monospace; font-size: 3rem; margin: 2rem; }
    #text::after { content: "|"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <span id="text"></span>

  <script>
    const word = "hello";
    let i = 0;
    const el = document.getElementById("text");

    const timer = setInterval(() => {
      el.textContent += word[i++];
      if (i >= word.length) clearInterval(timer);
    }, 200);
  </script>
</body>
</html>
